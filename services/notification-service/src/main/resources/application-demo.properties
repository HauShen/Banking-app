# Nightly reset (DemoNotificationsReset): empties this service's database, 5 minutes before the main app resets
# and seeds the demo again at 04:00. Spring cron (second minute hour day month weekday) in bank.time-zone
# (Asia/Kuala_Lumpur by default). "-" switches it off.
app.demo.reset-cron=0 55 3 * * *
