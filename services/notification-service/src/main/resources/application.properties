spring.application.name=notification-service

# 8080 is the main app, 8081 kafka-ui.
server.port=${SERVER_PORT:8082}

# --- Database: its own, notifications_db, on the same PostgreSQL server as the main app's banking_db ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/notifications_db}
spring.datasource.username=${POSTGRES_USER:hau}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Access tokens: issued by the main app, checked here with the same secret (AccessTokenVerifier) ---
security.jwt.secret=${JWT_SECRET}

# --- Kafka: reads the main app's transaction events. The main app creates the topics; this service only reads ---
# false = no listener (the REST API still works, nothing new arrives).
app.kafka.enabled=${KAFKA_ENABLED:true}
# localhost:9092 for bootRun/IntelliJ; Docker Compose sets kafka:19092.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# A consumer group that has never committed an offset starts at the oldest message, so a new service misses nothing
# that is still on the topic.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# The producer only copies broken messages to the dead-letter topic (KafkaConsumerConfig).
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.max.block.ms=5000

# --- Actuator: only /actuator/health, UP or DOWN without details ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# The repository's .env (JWT_SECRET, POSTGRES_PASSWORD): ./.env when started from the repository root (IntelliJ),
# ../../.env with "gradlew :notification-service:bootRun" (Gradle starts it in this folder).
spring.config.import=optional:file:./.env[.properties],optional:file:../../.env[.properties]
