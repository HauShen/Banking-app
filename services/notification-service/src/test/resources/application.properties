# Test configuration. It REPLACES src/main/resources/application.properties on the test classpath, so anything the
# tests need is restated here. The datasource comes from AbstractIntegrationTest (PostgreSQL in Testcontainers).

spring.application.name=notification-service

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Same test secret as the main app's tests. The tests sign their own tokens with it (AbstractIntegrationTest).
security.jwt.secret=dGVzdC1zZWNyZXQtbm90LWZvci1wcm9kdWN0aW9uLXVzZQ==

# Kafka is off for the normal suite; AbstractKafkaIntegrationTest starts a broker and turns it on.
app.kafka.enabled=false
