services:
  postgres:
    image: postgres:17
    container_name: postgresForBanking_db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abc123}
      POSTGRES_USER: ${POSTGRES_USER:-hau}
      POSTGRES_DB: ${POSTGRES_DB:-banking_db}
    command: >
      postgres -c shared_preload_libraries='pg_stat_statements'
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Lets the app service wait until the database really accepts connections.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - app-network

  # Kafka broker for the events that follow a money movement (notifications, alerts). Single node in KRaft mode
  # (no ZooKeeper). Starts with a plain "docker compose up -d", next to PostgreSQL.
  # Two listeners: containers (the app service) use kafka:19092, programs on your computer (bootRun, IntelliJ)
  # use localhost:9092.
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafkaForBanking
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # One broker, so every internal topic can only have one copy.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created by the app (KafkaTopicsConfig), never by a typo in a topic name.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # Any fixed base64 UUID; it only has to stay the same for the life of the kafkadata volume.
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
    volumes:
      - kafkadata:/var/lib/kafka/data
    # Healthy = the broker answers API requests. The check is a small JVM of its own, hence its own small heap.
    healthcheck:
      test: ["CMD-SHELL", "KAFKA_HEAP_OPTS=-Xmx128m /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - app-network

  # Web UI to look at topics, partitions, messages and consumer groups. Only with:
  #   docker compose --profile tools up -d   ->  http://localhost:8081
  kafka-ui:
    profiles: ["tools"]
    image: kafbat/kafka-ui:v1.4.2
    container_name: kafka_ui_for_banking
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: banking-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    networks:
      - app-network

  # The backend itself. Started only with:  docker compose --profile app up --build
  # A plain "docker compose up -d" starts PostgreSQL and Kafka only.
  app:
    profiles: ["app"]
    build: .
    image: banking-app:local
    container_name: banking_app
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      # "postgres" is the service name above: inside the Docker network, localhost would be the app container itself.
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-banking_db}
      POSTGRES_USER: ${POSTGRES_USER:-hau}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abc123}
      # The broker's listener for containers (see the kafka service above).
      KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      # No value here = passed through from .env. No default on purpose: the secret is never written in this file.
      JWT_SECRET:
      # The frontend's nginx forwards /api here: take the client address from its X-Forwarded-For header
      # (trusted only from internal addresses), so login throttling counts real clients, not the nginx container.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      # Browser origins: the Vite dev server and the frontend container below.
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
    networks:
      - app-network

  # The React frontend: nginx serves the build and forwards /api to the app service (one origin, no CORS).
  # Started together with the backend:  docker compose --profile app up --build  ->  http://localhost:3000
  # Use "localhost" (not 127.0.0.1 or a LAN address): the refresh cookie is Secure, and browsers accept
  # Secure cookies over plain http only on localhost.
  frontend:
    profiles: ["app"]
    build: ./frontend
    image: banking-frontend:local
    container_name: banking_frontend
    depends_on:
      - app
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      API_UPSTREAM: http://app:8080
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
  kafkadata:
