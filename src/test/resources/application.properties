# Test configuration.
#
# NOTE: this file REPLACES src/main/resources/application.properties on the test classpath
# (Spring loads the first application.properties it finds), so anything the tests need must
# be restated here.
#
# The datasource is deliberately absent: AbstractIntegrationTest supplies it from a
# Testcontainers PostgreSQL instance via @ServiceConnection, so tests run against the same
# database engine as production instead of an in-memory substitute.

spring.application.name=banking

# Same schema handling as production, so the suite also proves every migration applies
# cleanly and the entity mappings still match the resulting schema.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

security.jwt.secret=dGVzdC1zZWNyZXQtbm90LWZvci1wcm9kdWN0aW9uLXVzZQ==
security.jwt.expiration=3600000

# Enabled so tests can create the first admin through the real bootstrap endpoint
# rather than reaching into the repository layer.
bootstrap.admin.enabled=true
