# Test configuration.
#
# NOTE: this file REPLACES src/main/resources/application.properties on the test classpath
# (Spring loads the first application.properties it finds), so anything the tests need must
# be restated here.
#
# The datasource is deliberately absent: AbstractIntegrationTest (src/test/java/.../support) supplies
# it from a Testcontainers PostgreSQL instance via @DynamicPropertySource, so tests run against the
# same database engine as production instead of an in-memory substitute. Docker must be running.

spring.application.name=banking

# Same schema handling as production, so the suite also proves every migration applies
# cleanly and the entity mappings still match the resulting schema.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

security.jwt.secret=dGVzdC1zZWNyZXQtbm90LWZvci1wcm9kdWN0aW9uLXVzZQ==
security.jwt.expiration=3600000

# Login throttling. Every test request comes from 127.0.0.1, so the per-IP limit is set high here and tested
# in its own Spring context with a low value (LoginIpThrottlingSecurityTest) - otherwise it would block logins
# in unrelated tests. A 2-second lockout lets the tests check that a lock expires.
security.login.max-failures-per-user=5
security.login.max-failures-per-ip=1000
security.login.window=60s
security.login.lockout=2s

# The bootstrap runner creates this admin at startup, so integration tests can log in as an admin
# through the real /api/auth/login endpoint instead of reaching into the repository layer.
# The password is required: with enabled=true and no password the runner refuses to start the app.
# Test-only credentials, never used outside the Testcontainers database.
bootstrap.admin.enabled=true
bootstrap.admin.username=testadmin
bootstrap.admin.full-name=Test Admin
bootstrap.admin.email=testadmin@banking.test
bootstrap.admin.password=TestAdmin123!
