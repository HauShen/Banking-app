spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- API docs: Swagger UI at http://localhost:8080/swagger-ui/index.html (dev only) ---
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ---  Demo credentials — dev profile only, intentionally public, documented in the README. ---

bootstrap.admin.enabled=true
bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:devadmin}
bootstrap.admin.full-name=${BOOTSTRAP_ADMIN_FULLNAME:Dev Admin}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:devadmin@banking.local}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:DevAdmin123!}