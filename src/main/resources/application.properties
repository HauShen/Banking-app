
spring.application.name=banking

# --- Flyway ---
spring.flyway.enabled=true

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:banking_db}}
spring.datasource.username=${POSTGRES_USER:hau}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Security ---
security.jwt.secret=${JWT_SECRET}
# Access token lifetime in ms: short (15 min), the refresh cookie renews it
security.jwt.expiration=${JWT_EXPIRATION:900000}

# --- Refresh tokens: rotating, stored hashed, sent as an HttpOnly cookie ---
security.refresh.lifetime=${REFRESH_TOKEN_LIFETIME:7d}
security.refresh.cookie-secure=${REFRESH_COOKIE_SECURE:true}

# --- Login brute-force protection (in memory, per instance; see LoginAttemptService) ---
security.login.max-failures-per-user=5
security.login.max-failures-per-ip=20
security.login.window=15m
security.login.lockout=15m

# --- CORS: comma-separated frontend origins allowed to call the API from a browser ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- API docs (Swagger UI): off by default, the dev profile turns them on ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Exchange rates (fx module): MYR per 1 unit, fixed while the app runs ---
# Example values, not live rates. The currencies listed here are the ones the bank offers.
# buy = the bank buys the currency (customer receives foreign money), sell = the bank sells it (customer pays in it).
fx.rates.USD.buy=4.1650
fx.rates.USD.sell=4.2350
fx.rates.SGD.buy=3.2100
fx.rates.SGD.sell=3.2650
fx.rates.EUR.buy=4.8300
fx.rates.EUR.sell=4.9200
fx.rates.JPY.buy=0.02730
fx.rates.JPY.sell=0.02795
# How long a locked quote (POST /api/fx/quotes) keeps its rate.
fx.quote-validity=60s

# --- Actuator: only /actuator/health is exposed, and it answers UP or DOWN without any details ---
# Used by the Docker smoke test in CI and later by the host that runs the app. Public in SecurityConfig.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Bootstrap admin ---
bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
bootstrap.admin.full-name=${BOOTSTRAP_ADMIN_FULLNAME:}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

spring.config.import=optional:file:./.env[.properties]
