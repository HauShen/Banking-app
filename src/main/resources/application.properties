
spring.application.name=banking

# --- Flyway ---
spring.flyway.enabled=true

# --- Datasource ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/${POSTGRES_DB:banking_db}}
spring.datasource.username=${POSTGRES_USER:hau}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Security ---
security.jwt.secret=${JWT_SECRET}
# Access token lifetime in ms: short (15 min), the refresh cookie renews it
security.jwt.expiration=${JWT_EXPIRATION:900000}

# --- Refresh tokens: rotating, stored hashed, sent as an HttpOnly cookie ---
security.refresh.lifetime=${REFRESH_TOKEN_LIFETIME:7d}
security.refresh.cookie-secure=${REFRESH_COOKIE_SECURE:true}

# --- Login brute-force protection (in memory, per instance; see LoginAttemptService) ---
security.login.max-failures-per-user=5
security.login.max-failures-per-ip=20
security.login.window=15m
security.login.lockout=15m

# --- CORS: comma-separated frontend origins allowed to call the API from a browser ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- API docs (Swagger UI): off by default, the dev profile turns them on ---
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# --- Exchange rates (fx module): MYR per 1 unit, fixed while the app runs ---
# Example values, not live rates. The currencies listed here are the ones the bank offers.
# buy = the bank buys the currency (customer receives foreign money), sell = the bank sells it (customer pays in it).
fx.rates.USD.buy=4.1650
fx.rates.USD.sell=4.2350
fx.rates.SGD.buy=3.2100
fx.rates.SGD.sell=3.2650
fx.rates.EUR.buy=4.8300
fx.rates.EUR.sell=4.9200
fx.rates.JPY.buy=0.02730
fx.rates.JPY.sell=0.02795
# How long a locked quote (POST /api/fx/quotes) keeps its rate.
fx.quote-validity=60s

# --- Balance history: calendar days (and "today") are counted in the bank's time zone, not in UTC ---
bank.time-zone=Asia/Kuala_Lumpur

# --- Kafka: events after money has moved (notifications, alerts). The money movement itself never waits for Kafka ---
# false = no topics are created and nothing is sent to Kafka. Transfers work either way.
app.kafka.enabled=${KAFKA_ENABLED:true}
# localhost:9092 for bootRun/IntelliJ; Docker Compose sets kafka:19092 for the app container.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Topics are created by the app (KafkaTopicsConfig). One broker locally, so one copy of each partition.
app.kafka.topic-partitions=3
app.kafka.topic-replicas=${KAFKA_TOPIC_REPLICAS:1}
# Key = account number, value = JSON text (the event is already JSON when it leaves the outbox table).
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# A send counts as done only when every in-sync replica has it; retries never write a message twice.
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
# Fail fast when the broker is unreachable (defaults wait up to 60 s / 2 min): the relay then stops for the round
# and tries again, and its database transaction isn't held open for minutes.
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000

# --- Outbox relay: sends the events stored in outbox_events to Kafka (only with app.kafka.enabled=true) ---
# Intervals are ISO-8601 durations (PT1S = 1 second), as @Scheduled reads them.
app.outbox.relay-interval=PT1S
app.outbox.batch-size=100
# Longer than delivery.timeout.ms above, so the producer gives up first and reports why.
app.outbox.send-timeout=15s
app.outbox.backlog-check-interval=PT1M
app.outbox.backlog-warning-after=1m
app.outbox.cleanup-interval=PT1H
app.outbox.retention=7d

# --- Actuator: only /actuator/health is exposed, and it answers UP or DOWN without any details ---
# Used by the Docker smoke test in CI and later by the host that runs the app. Public in SecurityConfig.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Bootstrap admin ---
bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:}
bootstrap.admin.full-name=${BOOTSTRAP_ADMIN_FULLNAME:}
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}

spring.config.import=optional:file:./.env[.properties]
