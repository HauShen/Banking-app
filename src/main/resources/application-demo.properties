# --- Demo profile: the public live demo (plan: claude/demo-seed-plan.md) ---
# Seeds demo users, accounts and 90 days of transactions at startup (later steps of the plan).
# NEVER put "demo" in SPRING_PROFILES_ACTIVE for a real deployment: the logins below are public on purpose,
# shown on the login page and in the README. The app logs a WARN at startup while this profile is on.

# Swagger UI on, so visitors can browse the API. Every endpoint except login still needs a token.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# --- Demo data (DemoProperties) ---
# One password for every seeded customer (weiming, mei.ling, ahmad.f, priya.n, jason.k) and one for demoadmin.
# Intentionally public. Override with environment variables if the hosted demo should use other ones.
app.demo.customer-password=${DEMO_CUSTOMER_PASSWORD:Demo1234!}
app.demo.admin-password=${DEMO_ADMIN_PASSWORD:DemoAdmin1!}
# Seed of the random generator: the same seed gives the same demo data after every reset.
app.demo.random-seed=42
# How many days of transaction history the seeder writes, counted back from today.
app.demo.history-days=90
