name: CI

# Full build (compile + every test) on each push to master and on each pull request into master.
# The tests start PostgreSQL 17 with Testcontainers; the runner already has Docker, and the test
# configuration is self-contained, so this workflow needs no secrets and no database service.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

# By default the jobs only read the code. Only the publish job below gets more (it may write packages).
permissions:
  contents: read

# A new push to a pull request cancels the older run of that pull request. Runs on master are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle dependencies between runs and checks the wrapper jar.
      # "basic" is the MIT-licensed cache; the default (enhanced) cache is under Gradle's own terms of use.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test
        run: ./gradlew build

      # Runs even when a test failed, so the report of a red run can be downloaded and read.
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14

  # Builds the Docker image and proves that it really starts: the backend and PostgreSQL come up with
  # Docker Compose, and the backend must answer UP on /actuator/health. This job pushes nothing.
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      # JWT_SECRET here is a throwaway value made for this run only. The real one never leaves your .env.
      - name: Build the image and start the backend
        run: |
          export JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          docker compose --profile app up --build --detach

      - name: Wait until the health endpoint answers UP
        run: |
          for attempt in $(seq 1 40); do
            if curl --silent --fail http://localhost:8080/actuator/health | grep --quiet '"status":"UP"'; then
              echo "Backend is UP (attempt $attempt)."
              exit 0
            fi
            sleep 3
          done
          echo "Backend did not become healthy within 2 minutes."
          exit 1

      - name: Show the backend log if something failed
        if: ${{ failure() }}
        run: docker compose --profile app logs app

  # Runs only on master (that is: after a pull request is merged), and only when both jobs above passed.
  # Publishes the image to GitHub Container Registry as ghcr.io/haushen/banking-app
  publish:
    name: publish
    needs: [ build, docker ]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      # GITHUB_TOKEN is created by GitHub for this run and expires with it: there is no stored password.
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build the image
        run: |
          docker build \
            --tag banking-app:publish \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            .

      # One tag at a time, each with up to 3 attempts: the registry sometimes refuses a push for no good
      # reason (it did on the very first publish) and accepts the same push a few seconds later.
      - name: Push the image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"   # image names must be lower case
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAGS=("${GITHUB_REF_NAME#v}")           # v1.2.3 -> 1.2.3
          else
            TAGS=("latest" "sha-${GITHUB_SHA::7}")
          fi
          
          for tag in "${TAGS[@]}"; do
            docker tag banking-app:publish "$IMAGE:$tag"
            pushed=false
            for attempt in 1 2 3; do
              if docker push "$IMAGE:$tag"; then
                pushed=true
                break
              fi
              echo "Push of $IMAGE:$tag failed (attempt $attempt of 3). Waiting 15 seconds."
              sleep 15
            done
            if [[ "$pushed" != "true" ]]; then
              echo "Giving up on $IMAGE:$tag."
              exit 1
            fi
            echo "Published \`$IMAGE:$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done

  # Runs only for version tags, after the image is published: creates the GitHub Release for that tag,
  # with notes generated from the pull requests merged since the previous release.
  #   master      -> tags "latest" and "sha-xxxxxxx"
  #   tag v1.2.3  -> tag "1.2.3"
  release:
    name: release
    needs: publish
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "Docker image: \`$IMAGE\`"