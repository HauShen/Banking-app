name: CI

# Full build (compile + every test) on each push to master and on each pull request into master.
# The tests start PostgreSQL 17 with Testcontainers; the runner already has Docker, and the test
# configuration is self-contained, so this workflow needs no secrets and no database service.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# The jobs only read the code.
permissions:
  contents: read

# A new push to a pull request cancels the older run of that pull request. Runs on master are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle dependencies between runs and checks the wrapper jar.
      # "basic" is the MIT-licensed cache; the default (enhanced) cache is under Gradle's own terms of use.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test
        run: ./gradlew build

      # Runs even when a test failed, so the report of a red run can be downloaded and read.
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14

  # Proves the Dockerfile still builds. The image is thrown away: nothing is pushed anywhere yet.
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Build the image
        run: docker build --tag banking-app:ci .