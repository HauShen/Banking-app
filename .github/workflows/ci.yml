name: CI

# Full build (compile + every test) on each push to master and on each pull request into master.
# The tests start PostgreSQL 17 with Testcontainers; the runner already has Docker, and the test
# configuration is self-contained, so this workflow needs no secrets and no database service.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

# By default the jobs only read the code. Only the publish job below gets more (it may write packages).
permissions:
  contents: read

# A new push to a pull request cancels the older run of that pull request. Runs on master are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Caches Gradle dependencies between runs and checks the wrapper jar.
      # "basic" is the MIT-licensed cache; the default (enhanced) cache is under Gradle's own terms of use.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build and test
        run: ./gradlew build

      # Runs even when a test failed, so the report of a red run can be downloaded and read.
      - name: Upload test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: |
            build/reports/tests/test/
            services/notification-service/build/reports/tests/test/
          if-no-files-found: ignore
          retention-days: 14

  # Builds the Docker images and proves that they really start: PostgreSQL, the backend and the frontend
  # come up with Docker Compose, the backend must answer UP on /actuator/health, and the frontend's nginx
  # must serve the app and forward /api. This job pushes nothing.
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      # JWT_SECRET here is a throwaway value made for this run only. The real one never leaves your .env.
      - name: Build the images and start the backend and frontend
        run: |
          export JWT_SECRET="$(openssl rand -base64 48 | tr -d '\n')"
          docker compose --profile app up --build --detach

      - name: Wait until both health endpoints answer UP
        run: |
          wait_for_up() {
            for attempt in $(seq 1 40); do
              if curl --silent --fail "http://localhost:$2/actuator/health" | grep --quiet '"status":"UP"'; then
                echo "$1 is UP (attempt $attempt)."
                return 0
              fi
              sleep 3
            done
            echo "$1 did not become healthy within 2 minutes."
            return 1
          }
          wait_for_up backend 8080
          wait_for_up notification-service 8082

      # The frontend container serves the React app and forwards /api to the backend through nginx.
      - name: Check the frontend and the API through nginx
        run: |
          curl --silent --fail http://localhost:3000/ | grep --quiet '<div id="root">'
          echo "index.html served."
          # A page that only exists in React Router must still get index.html (single-page app fallback).
          curl --silent --fail http://localhost:3000/admin/users | grep --quiet '<div id="root">'
          echo "SPA fallback works."
          # /actuator/health is not under /api, so nginx doesn't forward it: use a public /api endpoint instead
          # (its JSON comes from Spring Boot, so the request went through nginx to the backend and its database).
          curl --silent --fail http://localhost:3000/api/auth/bootstrap-status | grep --quiet '"adminExists"'
          echo "API reachable through nginx."

      - name: Show the logs if something failed
        if: ${{ failure() }}
        run: docker compose --profile app logs app frontend

      # /api/notifications goes to notification-service, and a token the backend issued must work there
      # (same JWT_SECRET). Only the service answers this path now, so a 200 proves the whole route.
      # There is no public sign-up, so the token is the dev profile's bootstrap admin's (Compose defaults to
      # the dev profile; devadmin / DevAdmin123! from application-dev.properties, a local-only login).
      - name: Check notification-service through nginx
        run: |
          TOKEN=$(curl --silent --fail -X POST http://localhost:3000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"devadmin","password":"DevAdmin123!"}' \
            | jq --raw-output .accessToken)
          curl --silent --fail -H "Authorization: Bearer $TOKEN" http://localhost:3000/api/notifications/unread-count \
            | grep --quiet '"unread":0'
          echo "notification-service accepted the backend's token through nginx."

      - name: Show the logs if something failed
        if: ${{ failure() }}
        run: docker compose --profile app logs app notification-service frontend

  # Lints, tests and builds the React frontend in frontend/. Runs in parallel with the backend jobs.
  # The frontend is not part of the published image yet (it gets its own image later), so publish doesn't wait for it.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      # Caches the npm download cache between runs, keyed by the lockfile.
      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci installs exactly what package-lock.json says, and fails if it doesn't match package.json.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Runs only on master (that is: after a pull request is merged), and only when both jobs above passed.
  # Publishes the image to GitHub Container Registry as ghcr.io/haushen/banking-app
  publish:
    name: publish
    needs: [ build, docker ]
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v6

      # GITHUB_TOKEN is created by GitHub for this run and expires with it: there is no stored password.
      - name: Log in to GitHub Container Registry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build the image
        run: |
          docker build \
            --tag banking-app:publish \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            .

      # One tag at a time, each with up to 3 attempts: the registry sometimes refuses a push for no good
      # reason (it did on the very first publish) and accepts the same push a few seconds later.
      - name: Push the image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"   # image names must be lower case
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAGS=("${GITHUB_REF_NAME#v}")           # v1.2.3 -> 1.2.3
          else
            TAGS=("latest" "sha-${GITHUB_SHA::7}")
          fi
          
          for tag in "${TAGS[@]}"; do
            docker tag banking-app:publish "$IMAGE:$tag"
            pushed=false
            for attempt in 1 2 3; do
              if docker push "$IMAGE:$tag"; then
                pushed=true
                break
              fi
              echo "Push of $IMAGE:$tag failed (attempt $attempt of 3). Waiting 15 seconds."
              sleep 15
            done
            if [[ "$pushed" != "true" ]]; then
              echo "Giving up on $IMAGE:$tag."
              exit 1
            fi
            echo "Published \`$IMAGE:$tag\`" >> "$GITHUB_STEP_SUMMARY"
          done

  # Runs only for version tags, after the image is published: creates the GitHub Release for that tag,
  # with notes generated from the pull requests merged since the previous release.
  #   master      -> tags "latest" and "sha-xxxxxxx"
  #   tag v1.2.3  -> tag "1.2.3"
  release:
    name: release
    needs: publish
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --notes "Docker image: \`$IMAGE\`"